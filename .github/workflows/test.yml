name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: leadux-strategist validate examples/research-package.example.json
      - run: leadux-strategist validate examples/strategy-output.example.json --research examples/research-package.example.json
